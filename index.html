<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Director Packaging Console</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div>
        <h1>Director Packaging Console</h1>
        <p>Filter the full director universe by tier, lane, tone, scale, actor links, and availability signals.</p>
      </div>
      <div class="stats" id="stats"></div>
    </header>

    <main class="layout">
      <aside class="filters">
        <div class="panel">
          <h2>Script Match Filters</h2>
          <label>
            Search Director / Notes
            <input id="searchInput" type="search" placeholder="e.g. grounded thriller, IP reinvention" />
          </label>
          <label>
            Tier
            <select id="tierFilter" multiple></select>
          </label>
          <label>
            Primary lane
            <select id="laneFilter" multiple></select>
          </label>
          <label>
            Tonal DNA
            <select id="toneFilter" multiple></select>
          </label>
          <label>
            Scale proven
            <select id="scaleFilter" multiple></select>
          </label>
          <label>
            Budget band typical
            <select id="budgetFilter" multiple></select>
          </label>
          <label>
            Actor attachment (any)
            <input id="actorFilter" type="text" placeholder="e.g. Zendaya" />
          </label>
          <label>
            Availability contains
            <input id="availabilityFilter" type="text" placeholder="e.g. limited, available" />
          </label>
          <div class="actions">
            <button id="clearBtn" type="button">Clear filters</button>
          </div>
        </div>
      </aside>

      <section class="results">
        <div class="tableWrap">
          <table>
            <thead>
              <tr>
                <th>Director</th>
                <th>Tier</th>
                <th>Primary lane</th>
                <th>Tonal DNA</th>
                <th>Scale</th>
                <th>Budget band</th>
                <th>Actor links</th>
                <th>Next / Availability</th>
              </tr>
            </thead>
            <tbody id="resultsBody"></tbody>
          </table>
        </div>
      </section>
    </main>

    <template id="rowTemplate">
      <tr>
        <td class="directorCell"></td>
        <td></td>
        <td></td>
        <td></td>
        <td></td>
        <td></td>
        <td class="tagCell"></td>
        <td class="availabilityCell"></td>
      </tr>
    </template>

    <script src="app.js" defer></script>
  </body>
</html>
